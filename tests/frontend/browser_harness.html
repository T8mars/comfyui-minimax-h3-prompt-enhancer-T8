<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>T8 frontend browser contracts</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
  .node { position: relative; width: 620px; min-height: 240px; box-sizing: border-box; padding: 12px; }
  .advanced[hidden] { display: none; }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  button { height: 28px; }
</style>
<body><pre id="result">RUNNING</pre></body>
<script type="module">
const result = document.querySelector("#result");
const failures = [];
const check = (value, message) => { if (!value) failures.push(message); };
try {
  const state = await import("../../web/js/widget_state.mjs");
  const diagnostics = await import("../../web/js/diagnostics_viewer.mjs");
  const capability = await import("../../web/js/provider_capability_ui.mjs");
  const recommendation = await import("../../web/js/template_recommendation.mjs");
  const menu = await import("../../web/js/template_menu_preview.js");
  const templateBrowser = await import("../../web/js/template_browser.js");
  const {
    addCaseTemplateUI,
    createTemplateDetailCard,
    measureIntrinsicDomWidgetHeight,
    setDomWidgetVisible,
    TEMPLATE_DETAIL_MAX_HEIGHT,
  } = await import("../../web/js/case_template_ui.js");
  const { app } = await import("../../scripts/app.js");
  await import("../../web/js/film_workflow_ui.js");

  const widgets = ["prompt", "custom_model", "openai_base_url"].map((name) => ({ name, value: "" }));
  state.restoreNamedWidgetValues({ widgets }, new Map([
    ["prompt", "旧提示"], ["custom_model", "vendor/model"], ["openai_base_url", "https://provider.test/v1"],
  ]));
  check(widgets[1].value === "vendor/model", "hidden custom model persistence");
  check(widgets[2].value.endsWith("/v1"), "hidden Base URL persistence");

  const liveBase = document.createElement("input");
  const liveModel = document.createElement("input");
  liveBase.value = "https://live-provider.test/v1";
  liveModel.value = "vendor/live-model";
  const liveWidgets = [
    { name: "openai_base_url", value: "", inputEl: liveBase },
    { name: "custom_model", value: "", inputEl: liveModel },
  ];
  const liveNode = { widgets: liveWidgets, properties: {} };
  state.bindOpenAIProviderPersistence(liveNode, liveWidgets[0], liveWidgets[1]);
  liveNode.t8CommitOpenAIProviderState();
  const serializedProvider = {};
  state.serializeOpenAIProviderState(liveNode, serializedProvider);
  const reloadedWidgets = [
    { name: "openai_base_url", value: "", inputEl: document.createElement("input") },
    { name: "custom_model", value: "", inputEl: document.createElement("input") },
  ];
  state.restoreOpenAIProviderState(
    { widgets: reloadedWidgets, properties: {} },
    state.serializedOpenAIProviderState(serializedProvider),
  );
  check(reloadedWidgets[0].value === liveBase.value, "live Base URL saved before blur");
  check(reloadedWidgets[1].value === liveModel.value, "live model ID saved before blur");

  const heightProbe = document.createElement("div");
  heightProbe.style.cssText = "box-sizing:border-box;width:420px;height:8267px;max-height:8267px;overflow:hidden;padding:0";
  const heightProbeContent = document.createElement("div");
  heightProbeContent.style.height = "320px";
  heightProbe.append(heightProbeContent);
  document.body.append(heightProbe);
  check(heightProbe.scrollHeight >= 8000, "regression probe starts with the serialized oversized node height");
  const recoveredHeight = measureIntrinsicDomWidgetHeight(heightProbe);
  check(recoveredHeight >= 320 && recoveredHeight < 500, "template detail height ignores ComfyUI's oversized inline allocation");
  check(heightProbe.style.height === "8267px", "intrinsic measurement restores ComfyUI's assigned height");
  heightProbe.style.height = `${recoveredHeight}px`;
  heightProbe.style.maxHeight = `${recoveredHeight}px`;
  const stableHeight = measureIntrinsicDomWidgetHeight(heightProbe);
  check(stableHeight === recoveredHeight, "workflow restore height is idempotent after recovery");
  heightProbe.remove();

  const cappedProbe = createTemplateDetailCard();
  const cappedContent = document.createElement("div");
  cappedContent.style.height = "1200px";
  cappedProbe.append(cappedContent);
  document.body.append(cappedProbe);
  check(
    measureIntrinsicDomWidgetHeight(cappedProbe) === TEMPLATE_DETAIL_MAX_HEIGHT,
    "template detail height is capped and scrollable instead of expanding the node indefinitely",
  );
  cappedProbe.remove();

  const visibilityProbe = createTemplateDetailCard();
  document.body.append(visibilityProbe);
  const visibilityWidget = { type: "custom", element: visibilityProbe, computedHeight: 8267, width: 420 };
  setDomWidgetVisible(visibilityWidget, true);
  visibilityProbe.style.height = "8247px";
  visibilityWidget.computedHeight = 8267;
  setDomWidgetVisible(visibilityWidget, false);
  check(visibilityWidget.type === "converted-widget", "hidden template detail becomes a converted widget");
  check(visibilityWidget.computedHeight == null, "hiding template detail clears ComfyUI's cached height");
  check(visibilityProbe.style.height === "", "hiding template detail clears ComfyUI's assigned inline height");
  check(visibilityProbe.style.maxHeight === `${TEMPLATE_DETAIL_MAX_HEIGHT}px`, "hiding restores the card height cap");
  visibilityProbe.remove();

  function TemplateNode() {
    this.size = [620, 0];
    this.widgets = [];
    this.graph = { change() {} };
    this.setDirtyCanvas = () => {};
  }
  TemplateNode.prototype.addWidget = function (type, name, value, callback, options) {
    const widget = { type, name, value, callback, options, computeSize: () => [520, 28] };
    this.widgets.push(widget);
    return widget;
  };
  TemplateNode.prototype.addDOMWidget = function (name, type, element, options) {
    const widget = { name, type, element, options };
    this.widgets.push(widget);
    document.body.append(element);
    return widget;
  };
  TemplateNode.prototype.computeSize = function () {
    const height = this.widgets.reduce((sum, widget) => {
      if (widget.computeSize) return sum + Number(widget.computeSize()?.[1] || 0) + 4;
      return sum + 24;
    }, 24);
    return [this.size[0], height];
  };
  TemplateNode.prototype.setSize = function (size) {
    this.size = [...size];
    for (const widget of this.widgets) {
      if (!widget.element || widget.type === "converted-widget") {
        if (widget?.element) delete widget.computedHeight;
        continue;
      }
      const height = Number(widget.options?.getMinHeight?.() || 0);
      widget.computedHeight = height;
      widget.element.style.height = `${Math.max(0, height - 20)}px`;
      this.size[1] += Math.max(0, height - 24);
    }
  };
  const templateNode = new TemplateNode();
  const promptWidget = templateNode.addWidget("text", "prompt", "", () => {}, {});
  const caseWidget = templateNode.addWidget(
    "combo",
    "case_template",
    "无（不使用 T8 案例）",
    () => {},
    { values: ["无（不使用 T8 案例）", "Browser regression template"] },
  );
  const reflowTemplateNode = () => {
    for (const widget of templateNode.widgets) {
      if (widget.element) delete widget.computedHeight;
    }
    templateNode.setSize(templateNode.computeSize());
  };
  const detailWidget = await addCaseTemplateUI(templateNode, caseWidget, promptWidget, reflowTemplateNode);
  reflowTemplateNode();
  const collapsedTemplateHeight = templateNode.size[1];
  const collapsedHeights = [];
  const expandedHeights = [];
  for (let index = 0; index < 12; index += 1) {
    caseWidget.value = "Browser regression template";
    caseWidget.callback?.(caseWidget.value);
    expandedHeights.push(templateNode.size[1]);
    caseWidget.value = "无（不使用 T8 案例）";
    caseWidget.callback?.(caseWidget.value);
    collapsedHeights.push(templateNode.size[1]);
  }
  check(expandedHeights.every((height) => height > collapsedTemplateHeight), "selecting a T8 template expands its detail card");
  check(new Set(expandedHeights).size === 1, "repeated template selections keep one stable expanded height");
  check(collapsedHeights.every((height) => height === collapsedTemplateHeight), "switching a template back to None restores the original node height");
  check(detailWidget.hidden && detailWidget.element.hidden, "template detail is actually hidden after switching to None");
  check(detailWidget.element.childElementCount === 0, "hidden template detail releases rendered content and GIF nodes");
  detailWidget.element.remove();

  const filmExtension = app.extensions.find((item) => item.name === "T8.FilmWorkflowStatus");
  check(Boolean(filmExtension), "film workflow UI extension registered");
  function CharacterBibleNode() {
    this.size = [600, 0];
    this.widgets = [];
    this.section = document.createElement("section");
    this.section.className = "node";
    this.section.dataset.nodeId = "T8CharacterPerformanceBible";
    document.body.append(this.section);
    for (const name of [
      "character_id", "scene_objective", "obstacle_and_stakes", "tactics",
      "physical_task_and_inertia", "voice_lock", "mask_break_trigger", "gaze_and_listening",
    ]) {
      const element = document.createElement(name === "character_id" ? "input" : "textarea");
      element.dataset.widgetName = name;
      this.section.append(element);
      this.widgets.push({
        name,
        type: "text",
        hidden: false,
        element,
        computeSize: () => [520, name === "character_id" ? 28 : 58],
      });
    }
  }
  CharacterBibleNode.prototype.addWidget = function (type, name, value, callback, options) {
    const widget = { type, name, value, callback, options, computeSize: () => [520, 28] };
    this.widgets.push(widget);
    return widget;
  };
  CharacterBibleNode.prototype.addDOMWidget = function (name, type, element, options) {
    const widget = {
      name, type, element, options,
      computeSize: () => [520, Number(options.getMinHeight?.() || 0)],
    };
    this.widgets.push(widget);
    this.section.append(element);
    return widget;
  };
  CharacterBibleNode.prototype.computeSize = function () {
    const height = this.widgets.reduce((sum, widget) => sum + Math.max(0, Number(widget.computeSize?.()?.[1] || 0)), 24);
    return [Math.max(520, this.size[0]), height];
  };
  CharacterBibleNode.prototype.setSize = function (size) { this.size = size; };
  CharacterBibleNode.prototype.setDirtyCanvas = function () {};
  await filmExtension.beforeRegisterNodeDef(CharacterBibleNode, { name: "T8CharacterPerformanceBible" });
  const bibleNode = new CharacterBibleNode();
  bibleNode.onNodeCreated();
  const optionalNames = new Set([
    "tactics", "physical_task_and_inertia", "voice_lock", "mask_break_trigger", "gaze_and_listening",
  ]);
  const optionalWidgets = bibleNode.widgets.filter((widget) => optionalNames.has(widget.name));
  const bibleToggle = bibleNode.widgets.find((widget) => widget.name.includes("高级表演选项"));
  const bibleHelp = bibleNode.widgets.find((widget) => widget.name === "t8_character_bible_help");
  check(optionalWidgets.length === 5, "character bible exposes five advanced optional fields");
  check(optionalWidgets.every((widget) => widget.hidden && widget.element.hidden), "character bible optional fields start collapsed");
  check(Boolean(bibleToggle) && bibleToggle.options.serialize === false, "character bible advanced toggle is non-serialized");
  check(Boolean(bibleHelp) && bibleHelp.options.serialize === false, "character bible help card is non-serialized");
  check(bibleNode.widgets.at(-1) === bibleHelp, "character bible help card stays at the bottom");
  check(bibleHelp.element.textContent.includes("不要复制完整提示词"), "character bible help explains prompt separation");
  const collapsedHeight = bibleNode.size[1];
  bibleToggle.callback();
  check(optionalWidgets.every((widget) => !widget.hidden && !widget.element.hidden), "character bible optional fields expand on demand");
  check(bibleToggle.value === "收起 / Collapse", "character bible toggle reports expanded state");
  check(bibleNode.size[1] > collapsedHeight, "character bible grows after advanced fields expand");
  bibleToggle.callback();
  check(optionalWidgets.every((widget) => widget.hidden && widget.element.hidden), "character bible optional fields collapse again");
  bibleNode.onNodeCreated();
  check(bibleNode.widgets.filter((widget) => widget.name === "t8_character_bible_help").length === 1, "character bible help card is installed once");
  app.ui.settings.getSettingValue = () => "en";
  const englishBibleNode = new CharacterBibleNode();
  englishBibleNode.onNodeCreated();
  const englishBibleHelp = englishBibleNode.widgets.find((widget) => widget.name === "t8_character_bible_help");
  check(englishBibleHelp.element.textContent.includes("do not copy the complete main prompt"), "character bible help follows the English locale");
  app.ui.settings.getSettingValue = () => "zh";

  const renderedNodes = [];
  for (const nodeId of ["MiniMaxH3PromptEnhancerT8", "Seedance20PromptEnhancerT8", "MiniMaxMusic3PromptEnhancerT8"]) {
    const node = document.createElement("section");
    node.className = "node";
    node.dataset.nodeId = nodeId;
    const advanced = document.createElement("div");
    advanced.className = "advanced";
    advanced.hidden = true;
    advanced.textContent = "advanced";
    const actions = document.createElement("div");
    actions.className = "actions";
    const run = document.createElement("button");
    run.textContent = "运行";
    const diagnosticsButton = document.createElement("button");
    diagnosticsButton.textContent = "诊断";
    actions.append(run, diagnosticsButton);
    node.append(advanced, actions);
    document.body.append(node);
    advanced.hidden = false;
    node.style.width = "780px";
    const nodeRect = node.getBoundingClientRect();
    const runRect = run.getBoundingClientRect();
    check(runRect.bottom <= nodeRect.bottom + 0.5, `${nodeId} run button visible after resize`);
    check(runRect.height > 0, `${nodeId} run button has layout`);
    advanced.hidden = true;
    renderedNodes.push(node);
  }
  for (let index = 0; index < 600; index += 1) {
    const node = renderedNodes[index % renderedNodes.length];
    node.style.transform = `translate(${index % 41}px, ${index % 29}px)`;
    void node.offsetWidth;
  }

  const panel = document.createElement("aside");
  panel.style.cssText = [
    "position:fixed", "right:18px", "top:60px", "z-index:10", "display:flex", "flex-direction:column", "gap:8px",
    "box-sizing:border-box", "width:360px", "max-height:820px", "padding:12px", "overflow:auto",
    "border:1px solid #555", "border-radius:8px", "background:#202020", "color:#eee",
  ].join(";");
  document.body.append(panel);
  const gif = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
  menu.renderPreview(panel, {
    title: "two variants",
    previews: [{ label: "A", available: true, url: gif }, { label: "B", available: true, url: gif }],
    preview_manager: {
      label: "管理 / 更新动态预览",
      hint: "首次使用或 GIF 未显示时，请先检查并更新动态预览。",
      onClick: () => { panel.dataset.previewManagerClicks = String(Number(panel.dataset.previewManagerClicks || 0) + 1); },
    },
  }, () => {});
  check(panel.querySelectorAll("img").length === 1, "only one GIF is decoded at a time");
  const selector = panel.querySelector("select");
  selector.value = "1";
  selector.dispatchEvent(new Event("change"));
  check(panel.querySelectorAll("img").length === 1, "switching preview releases previous image");
  const previewManagerAction = panel.querySelector('[data-t8-preview-manager-action="true"]');
  check(Boolean(previewManagerAction), "template dropdown preview exposes preview manager action");
  previewManagerAction?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  check(panel.dataset.previewManagerClicks === "1", "preview manager action remains clickable inside dropdown preview");

  if (new URLSearchParams(location.search).get("state") !== "menu") {
    templateBrowser.openTemplateBrowser({
      catalog: {
        templates: [{
          id: "browser-case",
          label: "浏览器案例",
          authority: "T8 非官方模板",
          summary: "浏览器契约测试",
          input_format: "主体 + 动作",
          recommended_input: "角色穿过发光走廊",
          required_anchors: ["起点", "变化", "收束"],
          previews: [{ label: "案例 GIF", available: true, preview_url: gif }],
        }],
      },
      selectedValue: "浏览器案例",
      onSelect: () => {},
    });
    const browserManagerAction = document.querySelector(
      '.t8-template-browser-overlay [data-t8-preview-manager-action="true"]',
    );
    check(Boolean(browserManagerAction), "T8 template browser exposes conspicuous preview manager action");
    check(Boolean(document.querySelector('[data-t8-preview-manager-callout="true"]')), "template browser shows preview update reminder");
    browserManagerAction?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await new Promise((resolve) => requestAnimationFrame(resolve));
    check(
      [...document.querySelectorAll('section[role="dialog"]')].some((dialog) => dialog.textContent.includes("T8 动态预览资源管理")),
      "template browser preview manager action opens the resource manager",
    );
    browserManagerAction?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await new Promise((resolve) => requestAnimationFrame(resolve));
    check(
      document.querySelectorAll(".t8-preview-asset-manager-overlay").length === 1,
      "reopening preview manager replaces the previous modal instead of stacking overlays",
    );
    document.querySelector(".t8-preview-asset-manager-overlay")?.dispatchEvent(
      new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }),
    );
    check(
      document.querySelectorAll(".t8-preview-asset-manager-overlay").length === 0,
      "Escape closes the topmost preview manager",
    );
    check(
      document.querySelectorAll(".t8-template-browser-overlay").length === 1,
      "Escape on the preview manager does not close the underlying template browser",
    );
    document.body.dispatchEvent(new KeyboardEvent("keydown", { key: "Escape", bubbles: true, cancelable: true }));
    check(
      document.querySelectorAll(".t8-template-browser-overlay").length === 0,
      "after the preview manager closes, Escape still closes the template browser",
    );
  }

  const safe = diagnostics.sanitizeDiagnosticRecord({
    component: "node", provider: "provider", outcome: "success", stages: [], prompt: "secret-body",
  });
  check(!JSON.stringify(safe).includes("secret-body"), "diagnostics browser allowlist");
  check(capability.providerCapabilitySummary("OpenAI兼容接口（备用）", "https://unknown.test/v1").profile === "openai-compatible-unknown", "unknown provider boundary");
  check(recommendation.rankTemplates([{ id: "one", label: "产品广告", required_anchors: [] }], { prompt: "产品" })[0].template.id === "one", "local recommendation");
} catch (error) {
  failures.push(error?.stack || String(error));
}
result.textContent = failures.length ? `FAIL\n${failures.join("\n")}` : "PASS";
result.dataset.status = failures.length ? "fail" : "pass";
</script>
</html>

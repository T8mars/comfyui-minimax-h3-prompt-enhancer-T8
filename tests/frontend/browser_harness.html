<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>T8 frontend browser contracts</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 14px sans-serif; }
  .node { position: relative; width: 620px; min-height: 240px; box-sizing: border-box; padding: 12px; }
  .advanced[hidden] { display: none; }
  .actions { display: flex; flex-direction: column; gap: 4px; }
  button { height: 28px; }
</style>
<body><pre id="result">RUNNING</pre></body>
<script type="module">
const result = document.querySelector("#result");
const failures = [];
const check = (value, message) => { if (!value) failures.push(message); };
try {
  const state = await import("../../web/js/widget_state.mjs");
  const diagnostics = await import("../../web/js/diagnostics_viewer.mjs");
  const capability = await import("../../web/js/provider_capability_ui.mjs");
  const recommendation = await import("../../web/js/template_recommendation.mjs");
  const menu = await import("../../web/js/template_menu_preview.js");
  const templateBrowser = await import("../../web/js/template_browser.js");

  const widgets = ["prompt", "custom_model", "openai_base_url"].map((name) => ({ name, value: "" }));
  state.restoreNamedWidgetValues({ widgets }, new Map([
    ["prompt", "旧提示"], ["custom_model", "vendor/model"], ["openai_base_url", "https://provider.test/v1"],
  ]));
  check(widgets[1].value === "vendor/model", "hidden custom model persistence");
  check(widgets[2].value.endsWith("/v1"), "hidden Base URL persistence");

  const liveBase = document.createElement("input");
  const liveModel = document.createElement("input");
  liveBase.value = "https://live-provider.test/v1";
  liveModel.value = "vendor/live-model";
  const liveWidgets = [
    { name: "openai_base_url", value: "", inputEl: liveBase },
    { name: "custom_model", value: "", inputEl: liveModel },
  ];
  const liveNode = { widgets: liveWidgets, properties: {} };
  state.bindOpenAIProviderPersistence(liveNode, liveWidgets[0], liveWidgets[1]);
  liveNode.t8CommitOpenAIProviderState();
  const serializedProvider = {};
  state.serializeOpenAIProviderState(liveNode, serializedProvider);
  const reloadedWidgets = [
    { name: "openai_base_url", value: "", inputEl: document.createElement("input") },
    { name: "custom_model", value: "", inputEl: document.createElement("input") },
  ];
  state.restoreOpenAIProviderState(
    { widgets: reloadedWidgets, properties: {} },
    state.serializedOpenAIProviderState(serializedProvider),
  );
  check(reloadedWidgets[0].value === liveBase.value, "live Base URL saved before blur");
  check(reloadedWidgets[1].value === liveModel.value, "live model ID saved before blur");

  const renderedNodes = [];
  for (const nodeId of ["MiniMaxH3PromptEnhancerT8", "Seedance20PromptEnhancerT8", "MiniMaxMusic3PromptEnhancerT8"]) {
    const node = document.createElement("section");
    node.className = "node";
    node.dataset.nodeId = nodeId;
    const advanced = document.createElement("div");
    advanced.className = "advanced";
    advanced.hidden = true;
    advanced.textContent = "advanced";
    const actions = document.createElement("div");
    actions.className = "actions";
    const run = document.createElement("button");
    run.textContent = "运行";
    const diagnosticsButton = document.createElement("button");
    diagnosticsButton.textContent = "诊断";
    actions.append(run, diagnosticsButton);
    node.append(advanced, actions);
    document.body.append(node);
    advanced.hidden = false;
    node.style.width = "780px";
    const nodeRect = node.getBoundingClientRect();
    const runRect = run.getBoundingClientRect();
    check(runRect.bottom <= nodeRect.bottom + 0.5, `${nodeId} run button visible after resize`);
    check(runRect.height > 0, `${nodeId} run button has layout`);
    advanced.hidden = true;
    renderedNodes.push(node);
  }
  for (let index = 0; index < 600; index += 1) {
    const node = renderedNodes[index % renderedNodes.length];
    node.style.transform = `translate(${index % 41}px, ${index % 29}px)`;
    void node.offsetWidth;
  }

  const panel = document.createElement("aside");
  panel.style.cssText = [
    "position:fixed", "right:18px", "top:60px", "z-index:10", "display:flex", "flex-direction:column", "gap:8px",
    "box-sizing:border-box", "width:360px", "max-height:820px", "padding:12px", "overflow:auto",
    "border:1px solid #555", "border-radius:8px", "background:#202020", "color:#eee",
  ].join(";");
  document.body.append(panel);
  const gif = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==";
  menu.renderPreview(panel, {
    title: "two variants",
    previews: [{ label: "A", available: true, url: gif }, { label: "B", available: true, url: gif }],
    preview_manager: {
      label: "管理 / 更新动态预览",
      hint: "首次使用或 GIF 未显示时，请先检查并更新动态预览。",
      onClick: () => { panel.dataset.previewManagerClicks = String(Number(panel.dataset.previewManagerClicks || 0) + 1); },
    },
  }, () => {});
  check(panel.querySelectorAll("img").length === 1, "only one GIF is decoded at a time");
  const selector = panel.querySelector("select");
  selector.value = "1";
  selector.dispatchEvent(new Event("change"));
  check(panel.querySelectorAll("img").length === 1, "switching preview releases previous image");
  const previewManagerAction = panel.querySelector('[data-t8-preview-manager-action="true"]');
  check(Boolean(previewManagerAction), "template dropdown preview exposes preview manager action");
  previewManagerAction?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  check(panel.dataset.previewManagerClicks === "1", "preview manager action remains clickable inside dropdown preview");

  if (new URLSearchParams(location.search).get("state") !== "menu") {
    templateBrowser.openTemplateBrowser({
      catalog: {
        templates: [{
          id: "browser-case",
          label: "浏览器案例",
          authority: "T8 非官方模板",
          summary: "浏览器契约测试",
          input_format: "主体 + 动作",
          recommended_input: "角色穿过发光走廊",
          required_anchors: ["起点", "变化", "收束"],
          previews: [{ label: "案例 GIF", available: true, preview_url: gif }],
        }],
      },
      selectedValue: "浏览器案例",
      onSelect: () => {},
    });
    const browserManagerAction = document.querySelector(
      '.t8-template-browser-overlay [data-t8-preview-manager-action="true"]',
    );
    check(Boolean(browserManagerAction), "T8 template browser exposes conspicuous preview manager action");
    check(Boolean(document.querySelector('[data-t8-preview-manager-callout="true"]')), "template browser shows preview update reminder");
    browserManagerAction?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await new Promise((resolve) => requestAnimationFrame(resolve));
    check(
      [...document.querySelectorAll('section[role="dialog"]')].some((dialog) => dialog.textContent.includes("T8 动态预览资源管理")),
      "template browser preview manager action opens the resource manager",
    );
    browserManagerAction?.dispatchEvent(new MouseEvent("click", { bubbles: true }));
    await new Promise((resolve) => requestAnimationFrame(resolve));
    check(
      document.querySelectorAll(".t8-preview-asset-manager-overlay").length === 1,
      "reopening preview manager replaces the previous modal instead of stacking overlays",
    );
    document.querySelector(".t8-preview-asset-manager-overlay")?.remove();
  }

  const safe = diagnostics.sanitizeDiagnosticRecord({
    component: "node", provider: "provider", outcome: "success", stages: [], prompt: "secret-body",
  });
  check(!JSON.stringify(safe).includes("secret-body"), "diagnostics browser allowlist");
  check(capability.providerCapabilitySummary("OpenAI兼容接口（备用）", "https://unknown.test/v1").profile === "openai-compatible-unknown", "unknown provider boundary");
  check(recommendation.rankTemplates([{ id: "one", label: "产品广告", required_anchors: [] }], { prompt: "产品" })[0].template.id === "one", "local recommendation");
} catch (error) {
  failures.push(error?.stack || String(error));
}
result.textContent = failures.length ? `FAIL\n${failures.join("\n")}` : "PASS";
result.dataset.status = failures.length ? "fail" : "pass";
</script>
</html>

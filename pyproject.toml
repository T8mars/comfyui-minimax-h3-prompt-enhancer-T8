[project]
name = "minimax-h3-seedance-music3-prompt-enhancer-t8"
version = "1.24.5"
description = "Enhance MiniMax H3 and Seedance 2.0 video prompts, Music 3 and YuE2 music text, and Qwen Image 2.1 image prompts with cloud or local GGUF LLM providers."
authors = [
    { name = "T8mars", email = "20331866@qq.com" },
]
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "Pillow>=9.5.0",
    "requests>=2.31.0",
    "comfyui-frontend-package>=1.49.6",
    "tomli>=2.0.0; python_version < '3.11'",
]
classifiers = [
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/T8mars/comfyui-minimax-h3-prompt-enhancer-T8"
Documentation = "https://github.com/T8mars/comfyui-minimax-h3-prompt-enhancer-T8#readme"
"Bug Tracker" = "https://github.com/T8mars/comfyui-minimax-h3-prompt-enhancer-T8/issues"

[tool.comfy]
PublisherId = "t8star"
DisplayName = "MiniMax H3 / Seedance / Music / YuE2 / Qwen Image Enhancer (T8)"
Icon = "https://raw.githubusercontent.com/T8mars/comfyui-minimax-h3-prompt-enhancer-T8/main/assets/t8-prompt-enhancer-icon.svg"
Banner = "https://raw.githubusercontent.com/T8mars/comfyui-minimax-h3-prompt-enhancer-T8/main/assets/t8-prompt-enhancer-banner.svg"
requires-comfyui = ">=0.33.0"

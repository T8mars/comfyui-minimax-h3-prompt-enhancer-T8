name: Publish to Comfy Registry

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "pyproject.toml"

permissions:
  contents: read

concurrency:
  group: comfy-registry-publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - name: Check out node source
        uses: actions/checkout@v4
        with:
          path: _source
      - name: Check out minimum supported ComfyUI
        uses: actions/checkout@v4
        with:
          repository: Comfy-Org/ComfyUI
          ref: v0.33.0
          path: ComfyUI
      - name: Place node under ComfyUI custom_nodes
        shell: bash
        run: |
          mkdir -p ComfyUI/custom_nodes
          cp -a _source ComfyUI/custom_nodes/comfyui-minimax-h3-prompt-enhancer-T8
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            _source/pyproject.toml
            ComfyUI/requirements.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision torchaudio
          python -m pip install -r ComfyUI/requirements.txt
          python -m pip install pyyaml
      - name: Verify version is publishable
        working-directory: _source
        run: python tools/release.py --check-publish
      - name: Verify release contents
        working-directory: ComfyUI/custom_nodes/comfyui-minimax-h3-prompt-enhancer-T8
        env:
          T8_CONFIRM_PREVIEW_BUDGET: "1"
        run: python tools/verify_repository.py
      - name: Run unit and compatibility tests
        working-directory: ComfyUI/custom_nodes/comfyui-minimax-h3-prompt-enhancer-T8
        env:
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: python -m unittest discover -s tests
      - name: Run real-browser frontend contracts
        working-directory: ComfyUI/custom_nodes/comfyui-minimax-h3-prompt-enhancer-T8
        run: python tools/run_frontend_browser_tests.py

  publish-node:
    name: Publish custom node to Registry
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          skip_checkout: "true"
